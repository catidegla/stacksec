rules:
  - id: laravel-upload-trusts-client-mime-type
    languages: [php]
    severity: ERROR
    message: >-
      getClientMimeType returns the Content-Type header the client sent, and
      the client chooses it. Nothing here checks it against the file. Use
      getMimeType, which Symfony derives from the contents, or validate with
      mimes: or mimetypes:, both of which already do.
    metadata:
      category: security
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      framework: laravel
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://symfony.com/doc/current/components/http_foundation.html#uploaded-files
    # Only a comparison counts. Reading the client type to log it or to echo it
    # back is harmless, and flagging that would make this rule noise.
    patterns:
      - pattern-either:
          - pattern: in_array($F->getClientMimeType(), ...)
          - pattern: in_array($F->guessClientExtension(), ...)
          - pattern: $F->getClientMimeType() === $X
          - pattern: $F->getClientMimeType() == $X
          - pattern: $X === $F->getClientMimeType()
          - pattern: $X == $F->getClientMimeType()

  - id: laravel-upload-uses-client-filename
    languages: [php]
    severity: ERROR
    message: >-
      The uploaded file is stored under the name the client supplied.
      getClientOriginalName carries traversal sequences and double extensions,
      and nothing has sanitised it here. Use store(), which generates a random
      name, or build one from values the caller cannot influence.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      framework: laravel
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern: $F->storeAs($DIR, $NAME, ...)
          - pattern: $F->storeAs($DIR, $NAME)
          - pattern: $F->move($DIR, $NAME)
          - pattern: Storage::putFileAs($DIR, $F, $NAME)
      - metavariable-pattern:
          metavariable: $NAME
          patterns:
            - pattern-either:
                - pattern: $X->getClientOriginalName()
                - pattern: $X->getClientOriginalExtension()

  - id: laravel-upload-without-validation
    languages: [php]
    severity: WARNING
    message: >-
      An uploaded file is stored with no validation anywhere in this method.
      Without mimes: and max: rules the endpoint accepts any file of any size,
      which is a denial of service at best, and a web shell if the disk is
      served by the web server.
    metadata:
      category: security
      cwe: "CWE-434: Unrestricted Upload of File with Dangerous Type"
      framework: laravel
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
    # pattern-inside rather than pattern, so the finding lands on the store
    # call the developer has to change rather than on the function declaration
    # several lines above it.
    patterns:
      - pattern-inside: |
          public function $ACTION(...) { ... }
      - pattern: $REQ->file(...)->store(...)
      - pattern-not-inside: |
          public function $ACTION(...) {
            ...
            $V->validate(...);
            ...
          }
      - pattern-not-inside: |
          public function $ACTION(...) {
            ...
            $V->validated();
            ...
          }
      - pattern-not-inside: |
          public function $ACTION(...) {
            ...
            Validator::make(...);
            ...
          }
